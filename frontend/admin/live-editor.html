<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Board Editor — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html">Schedule</a>
      <a href="live-editor.html" class="active">Live Board</a>
      <a href="news-editor.html">News</a>
      <a href="jobs-editor.html">Jobs</a>
      <a href="content-editor.html">Content</a>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2 id="form-title">➕ Add Vessel</h2>
      <form id="live-form" onsubmit="saveVessel(event)">
        <div class="form-group">
          <label>Vessel Name</label>
          <input type="text" id="vessel-name" required placeholder="LC Example 1">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="vessel-status">
            <option value="⚓ Anchored">⚓ Anchored</option>
            <option value="🛳️ En route">🛳️ En route</option>
            <option value="📦 Loading">📦 Loading</option>
            <option value="⏸️ Delayed">⏸️ Delayed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Current Location</label>
          <input type="text" id="vessel-location" required placeholder="Port Vila">
        </div>
        <div class="form-group">
          <label>Next Destination / ETA</label>
          <input type="text" id="vessel-next" required placeholder="Tanna — Mon 08:00">
        </div>
        <div class="form-group">
          <label>Dinghy Status</label>
          <select id="vessel-dinghy">
            <option value="✅ Running">✅ Running</option>
            <option value="⏸️ On standby">⏸️ On standby</option>
            <option value="❌ Not running">❌ Not running</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Vessel</button>
        <button type="button" class="btn" id="cancel-btn" onclick="cancelEdit()" style="display:none; background:#888; color:white;">Cancel</button>
      </form>
    </div>

    <div class="admin-card">
      <h2>📋 Current Live Board</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Vessel</th>
            <th>Status</th>
            <th>Location</th>
            <th>Next</th>
            <th>Dinghy</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="live-body"></tbody>
      </table>
    </div>

  </main>

  <script src="admin.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let editingId = null;

    async function loadLive() {
      const vessels = await sb.get('live');
      renderLive(vessels);
    }

    function renderLive(vessels) {
      const body = document.getElementById('live-body');
      body.innerHTML = '';
      vessels.forEach(v => {
        body.innerHTML += `
          <tr>
            <td>${v.name}</td>
            <td>${v.status}</td>
            <td>${v.location}</td>
            <td>${v.next}</td>
            <td>${v.dinghy}</td>
            <td>
              <button class="btn" onclick='editVessel(${JSON.stringify(v).replace(/'/g, "&#39;")})' style="background:#FFB800; color:#003366;">Edit</button>
              <button class="btn btn-danger" onclick="deleteVessel(${v.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    async function saveVessel(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('vessel-name').value,
        status: document.getElementById('vessel-status').value,
        location: document.getElementById('vessel-location').value,
        next: document.getElementById('vessel-next').value,
        dinghy: document.getElementById('vessel-dinghy').value
      };

      if (editingId) {
        await sb.update('live', editingId, data);
      } else {
        await sb.insert('live', data);
      }

      cancelEdit();
      loadLive();
    }

    function editVessel(v) {
      editingId = v.id;
      document.getElementById('vessel-name').value = v.name;
      document.getElementById('vessel-status').value = v.status;
      document.getElementById('vessel-location').value = v.location;
      document.getElementById('vessel-next').value = v.next;
      document.getElementById('vessel-dinghy').value = v.dinghy;

      document.getElementById('form-title').textContent = '✏️ Edit Vessel';
      document.getElementById('submit-btn').textContent = 'Update Vessel';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('live-form').reset();
      document.getElementById('form-title').textContent = '➕ Add Vessel';
      document.getElementById('submit-btn').textContent = 'Add Vessel';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    async function deleteVessel(id) {
      if (!confirm('Delete this vessel?')) return;
      await sb.delete('live', id);
      loadLive();
    }

    loadLive();
  </script>

</body>
</html>
