<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Editor — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html">Schedule</a>
      <a href="live-editor.html">Live Board</a>
      <a href="news-editor.html">News</a>
      <a href="jobs-editor.html">Jobs</a>
      <a href="content-editor.html" class="active">Content</a>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2>📝 Page Content (3 Languages)</h2>
      <p style="color:#666; margin-bottom:16px; font-size:14px;">
        Edit text that appears on public pages. Each item has 3 language versions.
      </p>

      <div id="content-list"></div>
    </div>

  </main>

  <script src="admin.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    async function loadContent() {
      const rows = await sb.get('content');
      const container = document.getElementById('content-list');
      container.innerHTML = '';

      rows.forEach(r => {
        container.innerHTML += `
          <div style="border:1px solid #e0e4e8; border-radius:8px; padding:16px; margin-bottom:16px;">
            <div style="font-size:12px; color:#666; margin-bottom:8px;">
              Key: <code>${r.key}</code>
            </div>

            <div class="form-group">
              <label>🇻🇺 Bislama</label>
              <textarea id="bi-${r.id}" rows="2">${r.value_bi || ''}</textarea>
            </div>

            <div class="form-group">
              <label>🇬🇧 English</label>
              <textarea id="en-${r.id}" rows="2">${r.value_en || ''}</textarea>
            </div>

            <div class="form-group">
              <label>🇫🇷 Français</label>
              <textarea id="fr-${r.id}" rows="2">${r.value_fr || ''}</textarea>
            </div>

            <button class="btn btn-primary" onclick="saveContent(${r.id})">Save</button>
            <span id="saved-${r.id}" style="color:#00A86B; margin-left:12px; display:none;">✅ Saved</span>
          </div>
        `;
      });
    }

    async function saveContent(id) {
      await sb.update('content', id, {
        value_bi: document.getElementById(`bi-${id}`).value,
        value_en: document.getElementById(`en-${id}`).value,
        value_fr: document.getElementById(`fr-${id}`).value
      });

      const msg = document.getElementById(`saved-${id}`);
      msg.style.display = 'inline';
      setTimeout(() => msg.style.display = 'none', 2000);
    }

    loadContent();
  </script>

</body>
</html>
