<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Urata Shipping Co</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="login-wrap">
    <div class="login-box">
      <h1>Admin Login</h1>
      <p>Urata Shipping Co — Content Management</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <p id="login-error" style="color:#dc2626; margin-top:12px; display:none;">
        Wrong username or password.
      </p>

      <p style="margin-top:16px; font-size:13px; color:#666;">
        Demo: <strong>admin</strong> / <strong>demo123</strong>
      </p>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      // Demo credentials (later replaced by real backend)
      if (user === 'urata_admin' && pass === 'YourStrongPassword123!') {
        localStorage.setItem('admin_logged_in', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    // Auto-redirect if already logged in
    if (localStorage.getItem('admin_logged_in') === 'true') {
      window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
