<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Editor — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html" class="active">Schedule</a>
      <a href="live-editor.html">Live Board</a>
      <a href="news-editor.html">News</a>
      <a href="jobs-editor.html">Jobs</a>
      <a href="content-editor.html">Content</a>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2 id="form-title">➕ Add New Trip</h2>
      <form id="trip-form" onsubmit="saveTrip(event)">
        <div class="form-group">
          <label>Vessel</label>
          <input type="text" id="vessel" required placeholder="LC Example 1">
        </div>
        <div class="form-group">
          <label>From</label>
          <input type="text" id="from" required placeholder="Port Vila">
        </div>
        <div class="form-group">
          <label>To</label>
          <input type="text" id="to" required placeholder="Tanna">
        </div>
        <div class="form-group">
          <label>Departure</label>
          <input type="text" id="departure" required placeholder="Mon 08:00">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="on-time">On time</option>
            <option value="delayed">Delayed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Trip</button>
        <button type="button" class="btn" id="cancel-btn" onclick="cancelEdit()" style="display:none; background:#888; color:white;">Cancel</button>
      </form>
    </div>

    <div class="admin-card">
      <h2>📅 Current Schedule</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Vessel</th>
            <th>From</th>
            <th>To</th>
            <th>Departure</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="schedule-body"></tbody>
      </table>
    </div>

  </main>

  <script src="admin.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let editingId = null;

    async function loadSchedule() {
      const trips = await sb.get('schedule');
      renderSchedule(trips);
    }

    function renderSchedule(trips) {
      const body = document.getElementById('schedule-body');
      body.innerHTML = '';
      trips.forEach(trip => {
        const statusLabel = { 'on-time': 'On time', 'delayed': 'Delayed', 'cancelled': 'Cancelled' }[trip.status];
        body.innerHTML += `
          <tr>
            <td>${trip.vessel}</td>
            <td>${trip.from}</td>
            <td>${trip.to}</td>
            <td>${trip.departure}</td>
            <td><span class="status ${trip.status}">${statusLabel}</span></td>
            <td>
              <button class="btn" onclick='editTrip(${JSON.stringify(trip).replace(/'/g, "&#39;")})' style="background:#FFB800; color:#003366;">Edit</button>
              <button class="btn btn-danger" onclick="deleteTrip(${trip.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    async function saveTrip(e) {
      e.preventDefault();
      const data = {
        vessel: document.getElementById('vessel').value,
        from: document.getElementById('from').value,
        to: document.getElementById('to').value,
        departure: document.getElementById('departure').value,
        status: document.getElementById('status').value
      };

      if (editingId) {
        await sb.update('schedule', editingId, data);
      } else {
        await sb.insert('schedule', data);
      }

      cancelEdit();
      loadSchedule();
    }

    function editTrip(trip) {
      editingId = trip.id;
      document.getElementById('vessel').value = trip.vessel;
      document.getElementById('from').value = trip.from;
      document.getElementById('to').value = trip.to;
      document.getElementById('departure').value = trip.departure;
      document.getElementById('status').value = trip.status;

      document.getElementById('form-title').textContent = '✏️ Edit Trip';
      document.getElementById('submit-btn').textContent = 'Update Trip';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('trip-form').reset();
      document.getElementById('form-title').textContent = '➕ Add New Trip';
      document.getElementById('submit-btn').textContent = 'Add Trip';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    async function deleteTrip(id) {
      if (!confirm('Delete this trip?')) return;
      await sb.delete('schedule', id);
      loadSchedule();
    }

    loadSchedule();
  </script>

</body>
</html>
