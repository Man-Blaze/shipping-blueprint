<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobs Editor — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html">Schedule</a>
      <a href="live-editor.html">Live Board</a>
      <a href="news-editor.html">News</a>
      <a href="jobs-editor.html" class="active">Jobs</a>
      <a href="content-editor.html">Content</a>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2 id="form-title">💼 Post a Job (3 Languages)</h2>

      <form id="job-form" onsubmit="saveJob(event)">

        <div>
          <div class="lang-tabs">
            <button type="button" data-lang="bi" class="active">🇻🇺 Bislama</button>
            <button type="button" data-lang="en">🇬🇧 English</button>
            <button type="button" data-lang="fr">🇫🇷 Français</button>
          </div>

          <div class="lang-pane active" data-lang="bi">
            <div class="form-group">
              <label>Position (Bislama)</label>
              <input type="text" id="job-title-bi" placeholder="Deckhand">
            </div>
            <div class="form-group">
              <label>Requirements (Bislama) — one per line</label>
              <textarea id="job-req-bi" rows="4"></textarea>
            </div>
          </div>

          <div class="lang-pane" data-lang="en">
            <div class="form-group">
              <label>Position (English)</label>
              <input type="text" id="job-title-en">
            </div>
            <div class="form-group">
              <label>Requirements (English) — one per line</label>
              <textarea id="job-req-en" rows="4"></textarea>
            </div>
          </div>

          <div class="lang-pane" data-lang="fr">
            <div class="form-group">
              <label>Poste (Français)</label>
              <input type="text" id="job-title-fr">
            </div>
            <div class="form-group">
              <label>Exigences (Français) — une par ligne</label>
              <textarea id="job-req-fr" rows="4"></textarea>
            </div>
          </div>
        </div>

        <div class="form-group" style="margin-top:16px;">
          <label>Location</label>
          <input type="text" id="job-location" placeholder="Port Vila">
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Publish Job</button>
        <button type="button" class="btn" id="cancel-btn" onclick="cancelEdit()" style="display:none; background:#888; color:white;">Cancel</button>
      </form>
    </div>

    <div class="admin-card">
      <h2>📋 Published Jobs</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Position (BI)</th>
            <th>Position (EN)</th>
            <th>Position (FR)</th>
            <th>Location</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="jobs-body"></tbody>
      </table>
    </div>

  </main>

  <script src="admin.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    let editingId = null;

    async function loadJobs() {
      const jobs = await sb.get('jobs');
      renderJobs(jobs);
    }

    function renderJobs(jobs) {
      const body = document.getElementById('jobs-body');
      body.innerHTML = '';
      jobs.forEach(j => {
        body.innerHTML += `
          <tr>
            <td>${j.title_bi || '—'}</td>
            <td>${j.title_en || '—'}</td>
            <td>${j.title_fr || '—'}</td>
            <td>${j.location || '—'}</td>
            <td>
              <button class="btn" onclick='editJob(${JSON.stringify(j).replace(/'/g, "&#39;")})' style="background:#FFB800; color:#003366;">Edit</button>
              <button class="btn btn-danger" onclick="deleteJob(${j.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    async function saveJob(e) {
      e.preventDefault();
      const data = {
        title_bi: document.getElementById('job-title-bi').value,
        title_en: document.getElementById('job-title-en').value,
        title_fr: document.getElementById('job-title-fr').value,
        req_bi: document.getElementById('job-req-bi').value,
        req_en: document.getElementById('job-req-en').value,
        req_fr: document.getElementById('job-req-fr').value,
        location: document.getElementById('job-location').value
      };

      if (editingId) {
        await sb.update('jobs', editingId, data);
      } else {
        await sb.insert('jobs', data);
      }

      cancelEdit();
      loadJobs();
    }

    function editJob(j) {
      editingId = j.id;
      document.getElementById('job-title-bi').value = j.title_bi || '';
      document.getElementById('job-title-en').value = j.title_en || '';
      document.getElementById('job-title-fr').value = j.title_fr || '';
      document.getElementById('job-req-bi').value = j.req_bi || '';
      document.getElementById('job-req-en').value = j.req_en || '';
      document.getElementById('job-req-fr').value = j.req_fr || '';
      document.getElementById('job-location').value = j.location || '';

      document.getElementById('form-title').textContent = '✏️ Edit Job (3 Languages)';
      document.getElementById('submit-btn').textContent = 'Update Job';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('job-form').reset();
      document.getElementById('form-title').textContent = '💼 Post a Job (3 Languages)';
      document.getElementById('submit-btn').textContent = 'Publish Job';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    async function deleteJob(id) {
      if (!confirm('Delete this job?')) return;
      await sb.delete('jobs', id);
      loadJobs();
    }

    loadJobs();
  </script>

</body>
</html>
