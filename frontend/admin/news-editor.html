<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Editor — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html">Schedule</a>
      <a href="live-editor.html">Live Board</a>
      <a href="news-editor.html" class="active">News</a>
      <a href="jobs-editor.html">Jobs</a>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2>📰 Add News (3 Languages)</h2>

      <form id="news-form" onsubmit="addNews(event)">

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="news-date" required>
        </div>

        <div>
          <div class="lang-tabs">
            <button type="button" data-lang="bi" class="active">🇻🇺 Bislama</button>
            <button type="button" data-lang="en">🇬🇧 English</button>
            <button type="button" data-lang="fr">🇫🇷 Français</button>
          </div>

          <div class="lang-pane active" data-lang="bi">
            <div class="form-group">
              <label>Title (Bislama)</label>
              <input type="text" id="news-title-bi" placeholder="Example: Strong wind — Santo trip delayed">
            </div>
            <div class="form-group">
              <label>Body (Bislama)</label>
              <textarea id="news-body-bi" rows="4"></textarea>
            </div>
          </div>

          <div class="lang-pane" data-lang="en">
            <div class="form-group">
              <label>Title (English)</label>
              <input type="text" id="news-title-en">
            </div>
            <div class="form-group">
              <label>Body (English)</label>
              <textarea id="news-body-en" rows="4"></textarea>
            </div>
          </div>

          <div class="lang-pane" data-lang="fr">
            <div class="form-group">
              <label>Title (Français)</label>
              <input type="text" id="news-title-fr">
            </div>
            <div class="form-group">
              <label>Body (Français)</label>
              <textarea id="news-body-fr" rows="4"></textarea>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:16px;">Publish News</button>
      </form>
    </div>

    <div class="admin-card">
      <h2>📋 Published News</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Title (BI)</th>
            <th>Title (EN)</th>
            <th>Title (FR)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="news-body"></tbody>
      </table>
    </div>

  </main>

  <script src="admin.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    async function loadNews() {
      const news = await sb.get('news');
      renderNews(news);
    }

    function renderNews(news) {
      const body = document.getElementById('news-body');
      body.innerHTML = '';
      news.forEach(n => {
        body.innerHTML += `
          <tr>
            <td>${n.date}</td>
            <td>${n.title_bi || '—'}</td>
            <td>${n.title_en || '—'}</td>
            <td>${n.title_fr || '—'}</td>
            <td><button class="btn btn-danger" onclick="deleteNews(${n.id})">Delete</button></td>
          </tr>
        `;
      });
    }

    async function addNews(e) {
      e.preventDefault();
      await sb.insert('news', {
        date: document.getElementById('news-date').value,
        title_bi: document.getElementById('news-title-bi').value,
        title_en: document.getElementById('news-title-en').value,
        title_fr: document.getElementById('news-title-fr').value,
        body_bi: document.getElementById('news-body-bi').value,
        body_en: document.getElementById('news-body-en').value,
        body_fr: document.getElementById('news-body-fr').value
      });
      document.getElementById('news-form').reset();
      loadNews();
    }

    async function deleteNews(id) {
      if (!confirm('Delete this news item?')) return;
      await sb.delete('news', id);
      loadNews();
    }

    loadNews();
  </script>

</body>
</html>
