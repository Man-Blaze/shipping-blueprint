<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Editor — Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js" referrerpolicy="origin"></script>
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html">Schedule</a>
      <a href="live-editor.html">Live Board</a>
      <a href="news-editor.html" class="active">News</a>
      <a href="jobs-editor.html">Jobs</a>
      <a href="content-editor.html">Content</a>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2 id="form-title">📰 Add News</h2>

      <form id="news-form" onsubmit="saveNews(event)">

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="news-date" required>
        </div>

        <div class="form-group">
          <label>Title</label>
          <input type="text" id="news-title" required placeholder="Strong wind — Santo trip delayed">
        </div>

        <div class="form-group">
          <label>Body</label>
          <textarea id="news-body" class="rich-editor"></textarea>
        </div>

        <div class="form-group">
          <label>Author</label>
          <input type="text" id="news-author" placeholder="By Ezra Toara">
        </div>

        <div class="form-group">
          <label>Category</label>
          <input type="text" id="news-category" placeholder="Weather / Shipping / Business">
        </div>

        <div class="form-group">
          <label>Image URL (optional)</label>
          <input type="text" id="news-image" placeholder="https://... or /assets/images/...">
        </div>

        <div class="form-group">
          <label>Video URL (optional — YouTube)</label>
          <input type="text" id="news-video" placeholder="https://youtube.com/watch?v=...">
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="news-featured" style="width:auto; margin-right:8px;">
            Featured on home page
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Publish News</button>
        <button type="button" class="btn" id="cancel-btn" onclick="cancelEdit()" style="display:none; background:#888; color:white;">Cancel</button>
      </form>
    </div>

    <div class="admin-card">
      <h2>📋 Published News</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Title</th>
            <th>Category</th>
            <th>Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="news-list"></tbody>
      </table>
    </div>

  </main>

  <script src="admin.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script>
    // ---- TinyMCE init ----
    tinymce.init({
      selector: 'textarea.rich-editor',
      height: 400,
      menubar: false,
      plugins: 'link lists image code table paste wordcount',
      toolbar: 'undo redo | bold italic underline | h2 h3 | bullist numlist | link image | blockquote | removeformat | code',
      paste_data_images: true,
      branding: false,
      promotion: false,
      content_style: 'body { font-family: -apple-system, sans-serif; font-size: 15px; }'
    });

    function getBody() {
      const editor = tinymce.get('news-body');
      return editor ? editor.getContent() : document.getElementById('news-body').value;
    }

    function setBody(value) {
      const editor = tinymce.get('news-body');
      if (editor) {
        editor.setContent(value || '');
      } else {
        document.getElementById('news-body').value = value || '';
      }
    }

    // ---- News CRUD ----
    let editingId = null;

    async function loadNews() {
      const news = await sb.get('news');
      news.sort((a, b) => new Date(b.date) - new Date(a.date));
      renderNews(news);
    }

    function renderNews(news) {
      const body = document.getElementById('news-list');
      body.innerHTML = '';
      news.forEach(n => {
        const img = n.image_url ? '✅' : '—';
        body.innerHTML += `
          <tr>
            <td>${n.date}</td>
            <td>${n.title_en || n.title_bi || '—'}</td>
            <td>${n.category || '—'}</td>
            <td>${img}</td>
            <td>
              <button class="btn" onclick='editNews(${JSON.stringify(n).replace(/'/g, "&#39;")})' style="background:#FFB800; color:#003366;">Edit</button>
              <button class="btn btn-danger" onclick="deleteNews(${n.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    }

    async function saveNews(e) {
      e.preventDefault();

      const data = {
        date: document.getElementById('news-date').value,
        title_en: document.getElementById('news-title').value,
        body_en: getBody(),
        author: document.getElementById('news-author').value,
        category: document.getElementById('news-category').value,
        image_url: document.getElementById('news-image').value,
        video_url: document.getElementById('news-video').value,
        featured: document.getElementById('news-featured').checked
      };

      if (editingId) {
        await sb.update('news', editingId, data);
      } else {
        await sb.insert('news', data);
      }

      cancelEdit();
      loadNews();
    }

    function editNews(n) {
      editingId = n.id;
      document.getElementById('news-date').value = n.date || '';
      document.getElementById('news-title').value = n.title_en || n.title_bi || '';
      document.getElementById('news-author').value = n.author || '';
      document.getElementById('news-category').value = n.category || '';
      document.getElementById('news-image').value = n.image_url || '';
      document.getElementById('news-video').value = n.video_url || '';
      document.getElementById('news-featured').checked = n.featured || false;

      setBody(n.body_en || n.body_bi || '');

      document.getElementById('form-title').textContent = '✏️ Edit News';
      document.getElementById('submit-btn').textContent = 'Update News';
      document.getElementById('cancel-btn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('news-form').reset();
      setBody('');
      document.getElementById('form-title').textContent = '📰 Add News';
      document.getElementById('submit-btn').textContent = 'Publish News';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    async function deleteNews(id) {
      if (!confirm('Delete this news item?')) return;
      await sb.delete('news', id);
      loadNews();
    }

    loadNews();
  </script>

</body>
</html>
