<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Editor — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html">Schedule</a>
      <a href="live-editor.html">Live Board</a>
      <a href="news-editor.html" class="active">News</a>
      <a href="jobs-editor.html">Jobs</a>
      <a href="settings.html">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2>📰 Add News (3 Languages)</h2>
      <p style="color:#666; margin-bottom:16px; font-size:14px;">
        Enter news in all 3 languages. If English/French empty, Bislama shows to everyone.
      </p>

      <form id="news-form" onsubmit="addNews(event)">

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="news-date" required>
        </div>

        <div>
          <div class="lang-tabs">
            <button type="button" data-lang="bi" class="active">🇻🇺 Bislama</button>
            <button type="button" data-lang="en">🇬🇧 English</button>
            <button type="button" data-lang="fr">🇫🇷 Français</button>
          </div>

          <div class="lang-pane active" data-lang="bi">
            <div class="form-group">
              <label>Title (Bislama)</label>
              <input type="text" id="news-title-bi" placeholder="Example: Strong wind — Santo trip delayed">
            </div>
            <div class="form-group">
              <label>Body (Bislama)</label>
              <textarea id="news-body-bi" rows="4"></textarea>
            </div>
          </div>

          <div class="lang-pane" data-lang="en">
            <div class="form-group">
              <label>Title (English)</label>
              <input type="text" id="news-title-en" placeholder="Example: Strong wind — Santo trip delayed">
            </div>
            <div class="form-group">
              <label>Body (English)</label>
              <textarea id="news-body-en" rows="4"></textarea>
            </div>
          </div>

          <div class="lang-pane" data-lang="fr">
            <div class="form-group">
              <label>Title (Français)</label>
              <input type="text" id="news-title-fr" placeholder="Exemple : Fort vent — voyage retardé">
            </div>
            <div class="form-group">
              <label>Body (Français)</label>
              <textarea id="news-body-fr" rows="4"></textarea>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:16px;">Publish News</button>
      </form>
    </div>

    <div class="admin-card">
      <h2>📋 Published News</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Title (BI)</th>
            <th>Title (EN)</th>
            <th>Title (FR)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="news-body"></tbody>
      </table>
    </div>

  </main>

  <script src="admin.js"></script>
  <script>
    function loadNews() {
      const news = getData('news', [
        {
          date: '2026-09-16',
          title: { bi: 'Strong wind — Santo trip delayed', en: 'Strong wind — Santo trip delayed', fr: 'Fort vent — voyage retardé' },
          body: { bi: 'Due to strong winds...', en: 'Due to strong winds...', fr: 'En raison de vents forts...' }
        }
      ]);
      renderNews(news);
    }

    function renderNews(news) {
      const body = document.getElementById('news-body');
      body.innerHTML = '';
      news.forEach((n, i) => {
        body.innerHTML += `
          <tr>
            <td>${n.date}</td>
            <td>${n.title.bi || '—'}</td>
            <td>${n.title.en || '—'}</td>
            <td>${n.title.fr || '—'}</td>
            <td><button class="btn btn-danger" onclick="deleteNews(${i})">Delete</button></td>
          </tr>
        `;
      });
    }

    function addNews(e) {
      e.preventDefault();
      const news = getData('news', []);
      news.unshift({
        date: document.getElementById('news-date').value,
        title: {
          bi: document.getElementById('news-title-bi').value,
          en: document.getElementById('news-title-en').value,
          fr: document.getElementById('news-title-fr').value
        },
        body: {
          bi: document.getElementById('news-body-bi').value,
          en: document.getElementById('news-body-en').value,
          fr: document.getElementById('news-body-fr').value
        }
      });
      saveData('news', news);
      document.getElementById('news-form').reset();
      renderNews(news);
    }

    function deleteNews(index) {
      if (!confirm('Delete this news item?')) return;
      const news = getData('news', []);
      news.splice(index, 1);
      saveData('news', news);
      renderNews(news);
    }

    loadNews();
  </script>

</body>
</html>
