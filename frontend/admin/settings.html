<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body data-require-auth="true">

  <header class="admin-header">
    <h1>⚙️ Admin</h1>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule-editor.html">Schedule</a>
      <a href="live-editor.html">Live Board</a>
      <a href="news-editor.html">News</a>
      <a href="jobs-editor.html">Jobs</a>
      <a href="settings.html" class="active">Settings</a>
      <a href="#" onclick="logout()">Logout</a>
    </nav>
  </header>

  <main class="admin-main">

    <div class="admin-card">
      <h2>🏢 Company Information</h2>

      <form id="settings-form" onsubmit="saveSettings(event)">

        <div class="form-group">
          <label>Company Name</label>
          <input type="text" id="set-name" placeholder="Example Shipping Co">
        </div>

        <div class="form-group">
          <label>Address</label>
          <input type="text" id="set-address" placeholder="Port Vila, Vanuatu">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="set-phone" placeholder="+678 XXXX XXX">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="set-email" placeholder="info@example.vu">
        </div>

        <div class="form-group">
          <label>Facebook URL</label>
          <input type="text" id="set-facebook" placeholder="facebook.com/example">
        </div>

        <button type="submit" class="btn btn-primary">Save Settings</button>
      </form>

      <p id="settings-saved" style="color:#00A86B; margin-top:12px; display:none;">
        ✅ Settings saved.
      </p>
    </div>

  </main>

  <script src="admin.js"></script>
  <script>
    function loadSettings() {
      const s = getData('settings', {
        name: 'Example Shipping Co',
        address: 'Port Vila, Vanuatu',
        phone: '+678 XXXX XXX',
        email: 'info@example.vu',
        facebook: 'facebook.com/example'
      });
      document.getElementById('set-name').value = s.name || '';
      document.getElementById('set-address').value = s.address || '';
      document.getElementById('set-phone').value = s.phone || '';
      document.getElementById('set-email').value = s.email || '';
      document.getElementById('set-facebook').value = s.facebook || '';
    }

    function saveSettings(e) {
      e.preventDefault();
      saveData('settings', {
        name: document.getElementById('set-name').value,
        address: document.getElementById('set-address').value,
        phone: document.getElementById('set-phone').value,
        email: document.getElementById('set-email').value,
        facebook: document.getElementById('set-facebook').value
      });
      const msg = document.getElementById('settings-saved');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
    }

    loadSettings();
  </script>

</body>
</html>
