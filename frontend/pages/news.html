<!DOCTYPE html>
<html lang="bi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Latest news and announcements from Example Shipping Co.">
  <meta name="keywords" content="Vanuatu shipping news, announcements, inter-island">
  <meta name="author" content="Example Shipping Co">

  <meta property="og:title" content="News — Example Shipping Co">
  <meta property="og:description" content="Latest announcements.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blueprint-demo.netlify.app">
  <meta property="og:image" content="../assets/images/logo.png">

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <title>News — Example Shipping Co</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="../assets/images/logo.png" alt="Logo" class="site-logo">
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="schedule.html" data-i18n="nav.schedule">Schedule</a>
        <a href="live.html" data-i18n="nav.live">Live Board</a>
        <a href="routes.html" data-i18n="nav.routes">Routes</a>
        <a href="news.html" data-i18n="nav.news">News</a>
        <a href="jobs.html" data-i18n="nav.jobs">Jobs</a>
        <a href="about.html" data-i18n="nav.about">About</a>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="lang-switcher" role="group" aria-label="Language selection">
        <button data-lang="bi" onclick="i18n.setLang('bi')">BI</button>
        <button data-lang="en" onclick="i18n.setLang('en')">EN</button>
        <button data-lang="fr" onclick="i18n.setLang('fr')">FR</button>
      </div>
    </div>
  </header>

  <main role="main">
    <section class="card">
      <h1 data-i18n="nav.news">News</h1>
      <div id="public-news" class="news-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <h4 class="company-name">Example Shipping Co</h4>
        <p class="footer-address">Port Vila, Vanuatu</p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="nav.contact">Contact</h4>
        <p class="footer-phone">📞 +678 XXXX XXX</p>
        <p class="footer-email">✉️ info@example.vu</p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.language">Language</h4>
        <div class="lang-switcher" role="group" aria-label="Language selection">
          <button data-lang="bi" onclick="i18n.setLang('bi')">BI</button>
          <button data-lang="en" onclick="i18n.setLang('en')">EN</button>
          <button data-lang="fr" onclick="i18n.setLang('fr')">FR</button>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p><span class="footer-copyright">© 2026 Example Shipping Co</span>. <span data-i18n="footer.rights">All rights reserved</span>.</p>
    </div>
  </footer>

  <script src="../i18n.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/public-data.js"></script>
  <script src="../assets/js/news-list.js"></script>
